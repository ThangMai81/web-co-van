<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg"><style>.drop{animation:drop 1.2s linear infinite}@keyframes drop{0%{transform:translateY(-24px);opacity:0}25%{opacity:1}100%{transform:translateY(70px);opacity:0}}.bob{animation:bob 4.5s ease-in-out infinite}@keyframes bob{50%{transform:translateY(10px)}}.drift{animation:drift 14s ease-in-out infinite}.drift.slow{animation-duration:19s;animation-delay:-6s}@keyframes drift{50%{transform:translateX(40px)}}.breathe{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 3.6s ease-in-out infinite}.breathe.late{animation-delay:-1.8s}@keyframes breathe{50%{transform:scale(1.025,.985)}}.wiggle{transform-box:fill-box;transform-origin:50% 50%;animation:wiggle 3s ease-in-out infinite}.wiggle.late{animation-delay:-1.5s}@keyframes wiggle{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}.flow{animation:flow 1.6s linear infinite}@keyframes flow{to{stroke-dashoffset:-36}}.float{animation:bob 3.4s ease-in-out infinite}.pulse{transform-box:fill-box;transform-origin:50% 50%;animation:pulse 1.8s ease-in-out infinite}@keyframes pulse{0%,100%{transform:scale(1)}15%{transform:scale(1.1)}30%{transform:scale(1)}45%{transform:scale(1.06)}}.twinkle{transform-box:fill-box;transform-origin:50% 50%;animation:twinkle 2.4s ease-in-out infinite}@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.6)}50%{opacity:1;transform:scale(1.1)}}.glowpulse{animation:glowpulse 5s ease-in-out infinite}@keyframes glowpulse{50%{opacity:.6}}.rise{animation:rise 6s ease-in-out infinite}@keyframes rise{50%{transform:translateY(-14px)}}.rays{transform-box:view-box;transform-origin:800px 640px;animation:rays 3s ease-in-out infinite}@keyframes rays{50%{transform:scale(1.06);opacity:.7}}.hop{transform-box:fill-box;transform-origin:50% 100%;animation:hop 2.4s ease-in-out infinite}@keyframes hop{0%,60%,100%{transform:translateY(0)}75%{transform:translateY(-22px)}88%{transform:translateY(0) scale(1.03,.97)}}.birds{animation:birds 9s ease-in-out infinite}@keyframes birds{50%{transform:translate(30px,-12px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs>
